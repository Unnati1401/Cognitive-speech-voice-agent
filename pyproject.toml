[project]
name = "cognitive-speech-agent"
version = "0.1.0"
description = "Voice-based AI agent that extracts cognitive-linguistic markers from a short speech sample and drafts an interpretable screening report. Research demo, not a medical device."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- Core numerics / data ---
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    # --- Audio: transcription + diarization ---
    "torch>=2.3",
    "torchaudio>=2.3",
    "faster-whisper>=1.0",          # fast Whisper (CTranslate2) for word timestamps
    "pyannote.audio>=3.1",          # speaker diarization (needs HF token, see README)
    "soundfile>=0.12",
    "librosa>=0.10",
    # --- Acoustic features ---
    "opensmile>=2.5",               # eGeMAPS acoustic feature set
    # --- Linguistic features ---
    "spacy>=3.7",
    "sentence-transformers>=3.0",   # coherence via sentence embeddings
    # --- Optional learned embeddings (Path E) ---
    "transformers>=4.44",           # wav2vec2 / HuBERT / RoBERTa backbones
    # --- Scoring ---
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    # --- Report writer (LLM) ---
    "openai>=1.40",              # or swap for openai; see config.yaml
    "jinja2>=3.1",                  # report template scaffolding
]

[project.optional-dependencies]
app = [
    "fastapi>=0.114",
    "uvicorn>=0.30",
    "gradio>=4.44",                 # fast demo front end (Phase 5)
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
# Default: torch installs from PyPI, which works on Apple Silicon (MPS) and CPU.
# Run on first setup:  uv sync --extra app --extra dev
package = true

# --- If you later run on an NVIDIA/CUDA machine (Linux/Windows) ---
# Uncomment the block below to pull GPU-enabled torch wheels instead:
#
# [tool.uv.sources]
# torch = { index = "pytorch-cuda" }
# torchaudio = { index = "pytorch-cuda" }
#
# [[tool.uv.index]]
# name = "pytorch-cuda"
# url = "https://download.pytorch.org/whl/cu121"
# explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_speech_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
